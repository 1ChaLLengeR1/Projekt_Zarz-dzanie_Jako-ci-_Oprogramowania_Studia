version: '3.8'

services:
  my-app-backend:
    image: example-dockerhub/my-app-backend:latest
    env_file:
      - ../../env/prod.env
    volumes:
      - logs:/app/logs
    networks:
      - my-app-backend-network
      - my-app-traefik-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.my-app-backend.entrypoints=websecure"
        - "traefik.http.routers.my-app-backend.rule=Host(`api.my-app.example.com`)"
        - "traefik.http.routers.my-app-backend.tls.certresolver=myresolver"

        - "traefik.http.services.my-app-backend.loadbalancer.server.port=8000"
        - "traefik.http.services.my-app-backend.loadbalancer.passHostHeader=true"

        - "traefik.http.routers.my-app-backend-http.rule=Host(`api.my-app.example.com`)"
        - "traefik.http.routers.my-app-backend-http.entrypoints=web"
        - "traefik.http.routers.my-app-backend-http.middlewares=redirect-to-https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"


networks:
  my-app-traefik-network:
    external: true

  my-app-backend-network:
    driver: overlay

volumes:
  logs: