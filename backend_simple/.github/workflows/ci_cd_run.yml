name: CI/CD - Build, Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  # ── CI: Build & Push Docker Image ─────────────────────────────────────────
  ci_push:
    name: CI - Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set APP_VERSION timestamp
        run: echo "APP_VERSION=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-app.example.com:${{ env.APP_VERSION }} -f prod.dockerfile .
          docker tag ${{ secrets.DOCKER_USERNAME }}/my-app.example.com:${{ env.APP_VERSION }} ${{ secrets.DOCKER_USERNAME }}/my-app.example.com:latest

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app.example.com:${{ env.APP_VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app.example.com:latest


  # ── CD: Deploy to Server ───────────────────────────────────────────────────
  deploy:
    name: CD - Deploy to Server via Docker Swarm
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh-keyscan -H ${{ secrets.HOST_IP }} >> ~/.ssh/known_hosts

      - name: Clone repository
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh ${{ secrets.SSH_USER }}@${{ secrets.HOST_IP }} '
            rm -rf /var/www/myApp/my-app.example.com &&
            mkdir -p /var/www/myApp/my-app.example.com &&
            cd /var/www/myApp/my-app.example.com &&
            git clone --branch main git@github.com:example-org/my-app.git .
          '

      - name: Copy .env from server envs directory
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh ${{ secrets.SSH_USER }}@${{ secrets.HOST_IP }} '
            cp /var/www/envs/prod.env /var/www/myApp/my-app.example.com/.env
          '

      - name: Start application and prune images
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh ${{ secrets.SSH_USER }}@${{ secrets.HOST_IP }} '
            cd /var/www/myApp/my-app.example.com &&
            docker-compose up -d --build &&
            docker image prune -f
          '

      - name: Remove all files from server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh ${{ secrets.SSH_USER }}@${{ secrets.HOST_IP }} '
            rm -rf /var/www/myApp/my-app.example.com
          '